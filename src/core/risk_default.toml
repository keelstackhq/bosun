# Built-in risk rules (spec section 8). A repo overrides them with .bosun/risk.toml, which
# bosun reads from the PR's base branch, never from the PR head.

[[rule]]
id = "R-gov"
why = "Governance files decide who approves what."
paths = [".bosun/**", "governance/**", ".github/CODEOWNERS", ".claude/**", ".splice/**"]

[[rule]]
id = "R-ci"
why = "CI decides what is verified."
# Only the workflows that produce required checks.
paths = [
  ".github/workflows/ci.yml",
  ".github/workflows/risk.yml",
  ".github/workflows/verdict.yml",
  ".github/workflows/main-open.yml",
  ".github/workflows/review.yml",
]

[[rule]]
id = "R-gate"
why = "The gate code decides what passes."
paths = [
  "src/core/risk.rs",
  "src/core/verdict*",
  "src/cli/risk_check.rs",
  "src/cli/verdict*",
  "src/cli/approve.rs",
  "src/gates/**",
  "src/cli/test_integrity*",
]

[[rule]]
id = "R-ci-review"
why = "Other CI and shipped config; two independent reviews instead of the owner."
approval = "two-verdicts"
# channel/ is the CI and governance that `bosun init` ships to other repos.
paths = [".github/workflows/**", "channel/**", "deny.toml", "rust-toolchain.toml"]

[[rule]]
id = "R-secrets"
why = "A secret in the repo is a leak."
content = '(?i)(api[_-]?key|secret|token)\s*='

[[rule]]
id = "R-deps"
why = "A new dependency adds code that nobody reviewed."
new_dependency = true

[[rule]]
id = "R-prod-write"
why = "A write to production cannot be undone by a revert."
capability = "prod-write"
