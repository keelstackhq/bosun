name: verdict

# Posts the required `review-verdict` status from a verdict comment (spec §7). Cloud sessions
# cannot write commit statuses, so the reviewer runs `bosun verdict comment` and this workflow
# runs `bosun verdict apply`, which checks the comment (unedited, by a member, on its PR, for the
# current head) before it posts the status.
#
# issue_comment runs this file from the default branch. The job never checks out or runs PR
# code: it builds bosun from the default branch and reads the PR through the API. Event data
# reaches `run:` lines through `env:` only, never as `${{ }}` in a script.
on:
  issue_comment:
    types: [created]

# Least privilege: statuses for the verdict; issues: write for the verdict record comment and the
# task's state labels; read for the PR.
permissions:
  contents: read
  issues: write
  pull-requests: read
  statuses: write

jobs:
  verdict:
    if: >-
      github.event.issue.pull_request && contains(github.event.comment.body, '<!-- bosun:verdict -->')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bosun-bin
      - run: cargo build --release --locked --bin bosun
      - name: bosun verdict apply
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOSUN_REPO: ${{ github.repository }}
          BOSUN_SESSION: verdict-workflow
          COMMENT: ${{ github.event.comment.id }}
        run: ./target/release/bosun verdict apply "$COMMENT"
