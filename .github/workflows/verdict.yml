name: verdict

# Posts the required `review-verdict` status from a verdict comment (spec §7). Cloud sessions
# cannot write commit statuses, so the reviewer runs `bosun verdict comment` and this workflow
# runs `bosun verdict apply`, which checks the comment (unedited, by a member, on its PR, for the
# current head) before it posts the status.
#
# issue_comment runs this file from the default branch. The job never checks out or runs PR
# code: it runs the bosun release pinned on the default branch and reads the PR through the API. Event data
# reaches `run:` lines through `env:` only, never as `${{ }}` in a script.
on:
  issue_comment:
    types: [created]

# Every comment gets a group of its own. A group keeps only one pending run, so a shared group
# would cancel the pending run of one reviewer session when a third comment arrives, and that
# verdict would never be recorded. Order does not matter: `apply` lets a newer comment replace
# only the same session's for the same head, and refuses the older one whichever run is first.
concurrency:
  group: verdict-${{ github.event.issue.number }}-${{ github.event.comment.id }}
  cancel-in-progress: false

# Least privilege: statuses for the verdict; pull-requests: write for the verdict record comment
# (a workflow token needs it to comment on a PR; issues: write is not enough); issues: write for
# the linked task's state labels.
permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  verdict:
    if: >-
      github.event.issue.pull_request && contains(github.event.comment.body, '<!-- bosun:verdict -->')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # The release pinned in .bosun/version of this checkout (spec §11), as ci.yml's bosun-bin:
      # a main that does not compile cannot block its own mainfix. `unreleased` builds instead.
      - name: pinned release
        id: pin
        run: |
          v="$(tr -d '[:space:]' < .bosun/version 2>/dev/null || true)"
          case "$v" in ""|unreleased) v="";; esac
          # An exact x.y.z only: never a dist-tag, range, URL or path.
          if [ -n "$v" ] && ! printf '%s' "$v" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::.bosun/version must be 'unreleased' or an exact x.y.z, not '$v'"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - if: steps.pin.outputs.version != ''
        name: install the pinned release
        env:
          VERSION: ${{ steps.pin.outputs.version }}
        run: |
          npm install -g --ignore-scripts "@keelstackhq/bosun@${VERSION}"
          dir="$(cd "$(npm root -g)/@keelstackhq/bosun" && node -p "require('path').dirname(require.resolve('@keelstackhq/bosun-linux-x64/package.json'))")"
          mkdir -p target/release
          cp "$dir/bin/bosun" target/release/bosun
          got="$(target/release/bosun --version)"
          echo "$got"
          test "$got" = "bosun ${VERSION}"
      - if: steps.pin.outputs.version == ''
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
      - if: steps.pin.outputs.version == ''
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: bosun-bin
      - if: steps.pin.outputs.version == ''
        run: cargo build --release --locked --bin bosun
      - name: bosun verdict apply
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOSUN_REPO: ${{ github.repository }}
          BOSUN_SESSION: verdict-workflow
          COMMENT: ${{ github.event.comment.id }}
        run: ./target/release/bosun verdict apply "$COMMENT"
      # A verdict record written with GITHUB_TOKEN starts no other workflow, so judge the PR
      # again here: two verdicts can turn `risk-check` green (spec §8). Exit 5 (needs-human) is
      # the verdict, carried by the status; other non-zero exits fail the job.
      - name: bosun risk-check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOSUN_REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          rc=0
          ./target/release/bosun risk-check "$PR" || rc=$?
          [ "$rc" = 0 ] || [ "$rc" = 5 ]
