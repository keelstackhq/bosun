name: ci

on:
  # Only PRs into main: stacked PRs run once they target main, so they do not fill the queue.
  pull_request:
    branches: [main]
    # `edited` covers a stacked PR being retargeted to main.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  merge_group:

# A new push to the same PR or branch cancels its older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Whitespace errors in the change (trailing spaces, conflict markers).
      - name: diff check
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"

  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo nextest run --locked --no-fail-fast
      - run: cargo deny check

  # One stable required check for branch protection, the same name as in the other keelstackhq
  # repos: it fails unless every job above succeeded (also when one was skipped or cancelled).
  ci-ok:
    needs: [docs, rust]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs succeeded
        run: |
          echo "docs: ${{ needs.docs.result }}, rust: ${{ needs.rust.result }}"
          test "${{ needs.docs.result }}" = "success"
          test "${{ needs.rust.result }}" = "success"
