# Built-in ts-pnpm profile (spec §7). Override per repo in .bosun/profiles/ts-pnpm.toml.
# The gates call the workspace's own root package.json scripts, so a repo chooses its tools.
# A stack with no package.json yet (a repo right after `bosun init`) has nothing to check, so gates skip it.
manifest = "package.json"
[adapters]
packages = "pnpm-workspace"
pending = "ts-skip"
assertions = "ts"

# fmt: the root script `format:check` (e.g. prettier --check .).
[gates.fmt]
cmd = ["pnpm", "run", "format:check"]

# lint: the root script `lint` (e.g. eslint --max-warnings 0 .).
[gates.lint]
cmd = ["pnpm", "run", "lint"]

# types: the root script `typecheck` (e.g. tsc -b).
[gates.types]
cmd = ["pnpm", "run", "typecheck"]

# test: `--filter` must precede `run test` (later args go to the script), hence {packages};
# `...pkg` selects pkg and its dependents; all -> every package plus the root project's own script.
# --include-workspace-root runs the ROOT `test` script too, so it must not be a recursive
# `pnpm -r run test` (every package would run twice); keep it to the root project's own tests.
[gates.test]
cmd = ["pnpm", "{packages}", "run", "test"]
each_package = ["--filter", "...{package}"]
all = ["-r", "--include-workspace-root"]
when_no_package = "skip"

# deps: audit production dependencies only, fail on high or critical advisories; `pnpm audit`
# fails without a lockfile, so the gate is skipped until pnpm-lock.yaml exists (`requires`).
[gates.deps]
requires = "pnpm-lock.yaml"
cmd = ["pnpm", "audit", "--prod", "--audit-level", "high"]
