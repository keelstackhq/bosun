# Risk rules (spec §8). risk-check reads this file from the PR's base branch, never from the
# head, so a PR cannot change the rules that judge it. A rule only escalates.

[[rule]]
id = "R-gov"
why = "Governance files decide who approves what."
# REVIEW.md is what the reviewers apply.
paths = [".bosun/**", "governance/**", ".github/CODEOWNERS", ".claude/**", ".splice/**", "REVIEW.md"]

[[rule]]
id = "R-ci"
why = "CI decides what is verified."
paths = [".github/workflows/**", "deny.toml"]

[[rule]]
id = "R-gate"
why = "The gate code decides what passes."
# A file and its module directory: `x.rs` and `x/**`.
paths = [
    "src/core/risk.rs",
    "src/core/risk_default.toml",
    "src/core/verdict.rs",
    "src/core/verdict/**",
    "src/core/records.rs",
    "src/core/records/**",
    "src/core/meta.rs",
    "src/core/meta/**",
    "src/core/glob.rs",
    "src/core/glob/**",
    "src/core/approve.rs",
    "src/core/approve/**",
    "src/core/mod.rs",
    "src/cli/risk_check.rs",
    "src/cli/risk_check/**",
    "src/cli/verdict.rs",
    "src/cli/verdict/**",
    "src/cli/approve.rs",
    "src/cli/approve/**",
    "src/cli/test_integrity.rs",
    "src/cli/test_integrity/**",
    "src/cli/mod.rs",
    "src/gates/**",
    "src/github/**",
    "src/app.rs",
    "src/output.rs",
    "src/lib.rs",
    "src/main.rs",
    "profiles/**",
    "npm/**",
]

[[rule]]
id = "R-ci-review"
why = "Shipped CI and the toolchain; two independent reviews instead of the owner."
approval = "two-verdicts"
# channel/ is the CI and governance that `bosun init` ships to other repos.
paths = ["channel/**", "rust-toolchain.toml"]

[[rule]]
id = "R-secrets"
why = "A secret in the repo is a leak."
content = '(?i)(api[_-]?key|secret|token)\s*='

[[rule]]
id = "R-deps"
why = "A new dependency adds code that nobody reviewed."
new_dependency = true

[[rule]]
id = "R-prod-write"
why = "A write to production cannot be undone by a revert."
capability = "prod-write"
