# Risk rules (spec §8). risk-check reads this file from the PR's base branch, never from the
# head, so a PR cannot change the rules that judge it. A rule only escalates.

[[rule]]
id = "R-gov"
why = "Governance files decide who approves what."
paths = [".bosun/**", "governance/**", ".github/CODEOWNERS", ".claude/**", ".splice/**"]

[[rule]]
id = "R-ci"
why = "CI decides what is verified."
# channel/ is the CI and governance that `bosun init` ships to other repos.
paths = [".github/workflows/**", "deny.toml", "rust-toolchain.toml", "channel/**"]

[[rule]]
id = "R-secrets"
why = "A secret in the repo is a leak."
content = '(?i)(api[_-]?key|secret|token)\s*='

[[rule]]
id = "R-deps"
why = "A new dependency adds code that nobody reviewed."
new_dependency = true

[[rule]]
id = "R-prod-write"
why = "A write to production cannot be undone by a revert."
capability = "prod-write"
