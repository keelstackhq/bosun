# bosun runs on itself (spec §3). Unknown keys are an error.
project = "bosun"

[[stack]]
path = "."
profile = "rust"

[review]
# "subagent" (mode a) until M8 adds the CI review (mode b).
mode = "subagent"

[approvals]
# Bootstrap mode (D-012, spec §8): until this day (UTC, inclusive) an owner key's
# `--bootstrap` signature counts as the owner on owner-class PRs outside the excluded paths.
bootstrap_until = "2026-11-30"
# Who approves gated PRs once bootstrap mode is over (D-014, spec §8): the orchestrator for
# R-ci outside the CI workflows, the owner for the rest.
policy = "owner-gated"

[cloud]
# The shared cloud environment "keelstack" (spec §5.2): a relayed root starts there.
environment_id = "env_014hvpWkGQxciwPhBBysjvGr"
