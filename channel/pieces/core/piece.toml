id = "core"
description = "bosun governance, CI that runs `bosun gate`, the risk and verdict workflows, hooks"

[files]
# Owned: the bosun channel replaces them on update. A change goes to keelstackhq/bosun.
owned = [
  ".bosun/version",
  ".bosun/fold-fragments.sh",
  ".github/workflows/bosun.yml",
  ".github/workflows/risk.yml",
  ".github/workflows/verdict.yml",
  ".github/workflows/main-open.yml",
  ".github/workflows/main-health.yml",
  "docs/setup-script.sh",
]
# Shared: merged key by key with the repo's own edits.
shared = [".bosun/bosun.toml", ".claude/settings.json"]
# Seed: written once, then the repo's own. A stack added later does not re-render them: add its
# R-ci paths to .bosun/risk.toml and .github/CODEOWNERS by hand.
seed = [
  ".bosun/limits.toml",
  ".bosun/risk.toml",
  "governance/owners.toml",
  ".github/CODEOWNERS",
  ".github/workflows/splice.yml",
  "hoist.toml",
]

[merge]
".bosun/bosun.toml" = "toml"
".claude/settings.json" = "json"

[sections]
"AGENTS.md" = "sections/agents.md"
"REVIEW.md" = "sections/review.md"
