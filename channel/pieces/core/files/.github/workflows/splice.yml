name: splice

# Keeps the splice channels (.splice/channels/, bosun among them) fresh: opens or refreshes one
# PR on `splice/update`. A new bosun channel version arrives as that one PR (R-gov). See https://github.com/keelstackhq/splice#update-bot.
on:
  schedule: [{ cron: "17 6 * * 1" }]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    environment: splice-bot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: keelstackhq/splice/action@v1
        with:
          scope: all
          # Pinned: this job can write. Move it with the setup script's SPLICE_VERSION.
          version: 0.2.1
          # GITHUB_TOKEN works, but its PRs do not trigger CI.
          token: ${{ secrets.SPLICE_BOT_TOKEN || github.token }}
