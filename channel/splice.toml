# The splice channel that `bosun init` adds (spec D16): `splice channel add
# gh:keelstackhq/bosun//channel --as bosun --piece rust`. A channel version is a bosun release
# tag, so the channel and the pinned binary move together; the splice update bot brings each new
# version to a consumer as one R-gov PR.
format = 1
name = "bosun"
min_splice = "0.2.0"
base = "core"

[vars]
project = { prompt = "project name", default = "app", pattern = "^[A-Za-z0-9._-]+$" }
owner = { prompt = "GitHub login of the owner (empty: fill governance/owners.toml later)", default = "", pattern = "^([A-Za-z0-9-]+)?$" }
# Empty: pin the channel version. A branch or sha ref has no release version, so it must name one.
bosun_version = { prompt = "bosun release to pin (empty: the channel version)", default = "", pattern = "^([0-9]+\\.[0-9]+\\.[0-9]+)?$" }
rust_path = { prompt = "directory of the rust stack", default = ".", pattern = "^[A-Za-z0-9._/-]+$" }
ts_path = { prompt = "directory of the ts-pnpm stack", default = ".", pattern = "^[A-Za-z0-9._/-]+$" }
# Non-empty when the repo already has its own ci.yml with a `ci-ok` job (a hull template, for
# example): bosun.yml then names its aggregate job `bosun-ok`, a second required check.
own_ci = { prompt = "the repo has its own ci.yml and ci-ok job (1 or empty)", default = "", pattern = "^1?$" }
